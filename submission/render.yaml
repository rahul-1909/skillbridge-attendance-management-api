services:
  - type: web
    name: skillbridge-attendance-management-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET
        generateValue: true
      - key: MONITORING_API_KEY
        value: monitoring-dev-key
      - key: AUTO_SEED
        value: "true"
